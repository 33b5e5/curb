version: 2

gomod:
  proxy: true

builds:
  - main: curb
    binary: curb
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

release:
  draft: true
  prerelease: auto

homebrew_casks:
  - repository:
      owner: 33b5e5
      name: homebrew-tap
    homepage: "https://gocurb.dev"
    description: "Modern HTTPS-only alternative to curl and wget"
    # Homebrew deprecated the raw-Ruby `postflight` stanza that goreleaser's
    # `hooks.post.install` emits, so write the declarative `postflight_steps`
    # stanza ourselves until goreleaser ships native support
    # (https://github.com/goreleaser/goreleaser/pull/6873). goreleaser runs the
    # rendered cask through Go templates, hence the escaped Homebrew token.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/curb"]
        end
      end
